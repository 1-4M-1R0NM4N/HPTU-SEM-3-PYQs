<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B.Tech. 3rd Semester Solved Question Bank</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Fraunces (Serif Display) & Plus Jakarta Sans (Clean Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #FAF6F0;
      --bg-card: #F3ECE1;
      --bg-card-hover: #EFE6D8;
      --border-card: #E5DAC8;
      --ink-primary: #2C241E;
      --ink-secondary: #6E5F53;
      --accent: #B85D3B;
      --accent-soft: rgba(184, 93, 59, 0.12);
    }

    html.dark {
      --bg-page: #1C1917;
      --bg-card: #26221F;
      --bg-card-hover: #2E2925;
      --border-card: #38322D;
      --ink-primary: #EAE2D6;
      --ink-secondary: #9E9183;
      --accent: #E09F5A;
      --accent-soft: rgba(224, 159, 90, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      margin: 0;
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Fraunces', Georgia, serif;
    }

    .tile-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      transition: transform 0.22s ease, background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    a.tile-card:hover,
    a.tile-card:focus-visible {
      background-color: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px -8px rgba(44, 36, 30, 0.12);
      outline: none;
    }

    html.dark a.tile-card:hover,
    html.dark a.tile-card:focus-visible {
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.45);
    }

    .icon-badge {
      background-color: var(--accent-soft);
      color: var(--accent);
      transition: transform 0.22s ease;
    }

    a.tile-card:hover .icon-badge {
      transform: scale(1.06);
    }

    .theme-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--ink-secondary);
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .theme-btn:hover {
      color: var(--ink-primary);
      border-color: var(--accent);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-[#B85D3B]/20">

  <!-- Subtle Corner Light / Dark Mode Toggle -->
  <header class="w-full max-w-5xl mx-auto px-6 pt-6 sm:pt-8 flex justify-end">
    <button
      id="theme-toggle"
      type="button"
      class="theme-btn p-2.5 rounded-full cursor-pointer flex items-center justify-center"
      aria-label="Toggle warm light or dark theme"
      title="Switch theme"
    >
      <!-- Sun icon (shown in dark mode) -->
      <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" />
      </svg>
      <!-- Moon icon (shown in light mode) -->
      <svg id="icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
      </svg>
    </button>
  </header>

  <!-- Centered Main Workspace -->
  <main class="w-full max-w-4xl mx-auto px-6 py-12 sm:py-16 flex-1 flex flex-col items-center justify-center">

    <!-- Minimalist Hero Heading -->
    <h1 class="font-display text-3xl sm:text-4xl md:text-[2.65rem] font-bold tracking-tight text-center leading-tight mb-12 sm:mb-16 max-w-2xl">
      B.Tech. 3rd Semester Solved Question Bank
    </h1>

    <!-- Clean 6-Tile Subject Grid -->
    <section aria-label="Subjects" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">

      <!-- 1. Probability & Statistics -->
      <a href="mafc_311_probability_statistics_numerical_methods_exam_prep.html" class="tile-card rounded-3xl p-7 sm:p-8 flex flex-col items-center text-center group">
        <div class="icon-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-5">
          <!-- Bell Curve / Statistics SVG Icon -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 18h18" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 17c3.2 0 4.5-11 8-11s4.8 11 8 11" />
            <path stroke-linecap="round" stroke-dasharray="2 2" d="M12 6v12" />
          </svg>
        </div>
        <h2 class="text-base sm:text-lg font-bold tracking-tight mb-1">
          Probability &amp; Statistics
        </h2>
        <span class="text-xs font-medium tracking-wider uppercase" style="color: var(--ink-secondary);">
          MAFC-311
        </span>
      </a>

      <!-- 2. Electronic Devices -->
      <a href="ecepc_311_electronic_devices_complete_exam_prep.html" class="tile-card rounded-3xl p-7 sm:p-8 flex flex-col items-center text-center group">
        <div class="icon-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-5">
          <!-- Semiconductor BJT / Diode Symbol SVG Icon -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 8v8M4 12h5.5M9.5 10.2L15 6.8v-2M9.5 13.8L15 17.2v2" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 17.2h2v-2" />
          </svg>
        </div>
        <h2 class="text-base sm:text-lg font-bold tracking-tight mb-1">
          Electronic Devices
        </h2>
        <span class="text-xs font-medium tracking-wider uppercase" style="color: var(--ink-secondary);">
          ECEPC-311
        </span>
      </a>

      <!-- 3. Digital System Design -->
      <a href="ecepc_312_digital_system_design_complete_exam_prep.html" class="tile-card rounded-3xl p-7 sm:p-8 flex flex-col items-center text-center group">
        <div class="icon-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-5">
          <!-- Logic Gate (AND / NAND) SVG Icon -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9h4M3 15h4M18 12h3" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 6h5a6 6 0 010 12H7V6z" />
          </svg>
        </div>
        <h2 class="text-base sm:text-lg font-bold tracking-tight mb-1">
          Digital System Design
        </h2>
        <span class="text-xs font-medium tracking-wider uppercase" style="color: var(--ink-secondary);">
          ECEPC-312
        </span>
      </a>

      <!-- 4. Signals & Systems -->
      <a href="ecepc_313_signals_and_systems_complete_exam_prep.html" class="tile-card rounded-3xl p-7 sm:p-8 flex flex-col items-center text-center group">
        <div class="icon-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-5">
          <!-- Continuous Sine Waveform SVG Icon -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2 12h20" opacity="0.35" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12c2.2-6 4.8-6 7 0s4.8 6 7 0c1.1-3 2.5-4.5 4-4.5" />
          </svg>
        </div>
        <h2 class="text-base sm:text-lg font-bold tracking-tight mb-1">
          Signals &amp; Systems
        </h2>
        <span class="text-xs font-medium tracking-wider uppercase" style="color: var(--ink-secondary);">
          ECEPC-313
        </span>
      </a>

      <!-- 5. Network Theory (Disabled / Coming Soon) -->
      <div
        aria-disabled="true"
        class="tile-card rounded-3xl p-7 sm:p-8 flex flex-col items-center text-center opacity-70 cursor-not-allowed select-none"
      >
        <div class="icon-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-5">
          <!-- Circuit Resistor Zig-Zag SVG Icon -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2 12h4l1.5-4 3 8 3-8 3 8 1.5-4h4" />
          </svg>
        </div>
        <h2 class="text-base sm:text-lg font-bold tracking-tight mb-1">
          Network Theory
        </h2>
        <span class="text-xs font-medium tracking-wider uppercase" style="color: var(--ink-secondary);">
          ECEPC-314
        </span>
        <span class="mt-2 text-xs font-semibold tracking-wide" style="color: var(--accent);">
          Coming soon
        </span>
      </div>

      <!-- 6. Engineering Economics -->
      <a href="hs_311_engineering_economics_complete_exam_prep.html" class="tile-card rounded-3xl p-7 sm:p-8 flex flex-col items-center text-center group">
        <div class="icon-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-5">
          <!-- Supply-Demand / Growth Trend SVG Icon -->
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v16h16" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 15l4-4 3 3 5-6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 8h4v4" />
          </svg>
        </div>
        <h2 class="text-base sm:text-lg font-bold tracking-tight mb-1">
          Engineering Economics

        <span class="text-xs font-medium tracking-wider uppercase" style="color: var(--ink-secondary);">
          HS-311
        </span>
      </a>

    </section>
  </main>

  <!-- Minimalist Footer -->
  <footer class="w-full py-7 px-6 text-center">
    <p class="text-xs sm:text-sm font-medium inline-flex items-center justify-center gap-1.5" style="color: var(--ink-secondary);">
      <span>Made with</span>
      <svg class="w-4 h-4 inline-block shrink-0" style="color: var(--accent);" fill="currentColor" viewBox="0 0 24 24" aria-label="love">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
      <span>by <span style="color: var(--ink-primary);" class="font-semibold">Akshansh Sharma</span></span>
    </p>
  </footer>

  <!-- Theme Persistence Logic -->
  <script>
    (function () {
      const STORAGE_KEY = 'btech-nep-theme';
      const root = document.documentElement;
      const toggleBtn = document.getElementById('theme-toggle');
      const iconSun = document.getElementById('icon-sun');
      const iconMoon = document.getElementById('icon-moon');

      function applyTheme(theme) {
        const isDark = theme === 'dark';
        root.classList.toggle('dark', isDark);
        iconSun.classList.toggle('hidden', !isDark);
        iconMoon.classList.toggle('hidden', isDark);
      }

      // Initialize from localStorage or system preference
      try {
        const savedTheme = localStorage.getItem(STORAGE_KEY);
        if (savedTheme === 'dark' || savedTheme === 'light') {
          applyTheme(savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          applyTheme('dark');
        } else {
          applyTheme('light');
        }
      } catch (e) {
        applyTheme('light');
      }

      toggleBtn.addEventListener('click', function () {
        const nextTheme = root.classList.contains('dark') ? 'light' : 'dark';
        applyTheme(nextTheme);
        try {
          localStorage.setItem(STORAGE_KEY, nextTheme);
        } catch (e) {
          // Ignore storage errors in restricted contexts
        }
      });
    })();
  </script>
</body>
</html>
